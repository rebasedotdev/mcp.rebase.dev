name: Release
run-name: 📦 Stage ${{ github.ref_name }} on npm

# Tag-triggered publish — the lowest-ceremony release flow for a single package.
# To cut a release:
#   npm version patch   # bumps package.json, commits, creates the v* tag
#   git push --follow-tags
# (When package.json already carries the version to release — e.g. the first
# release — skip `npm version` and tag by hand: `git tag -a vX.Y.Z -m X.Y.Z`.)
# The pushed tag triggers this workflow, which re-runs the tests and stages the
# version on npm with provenance. Nothing goes live until a maintainer approves it:
# npmjs.com → Staged Packages → Approve (security key), or `npm stage approve <id>`. (Tag pushed from a developer's own credentials DOES trigger
# `on: push: tags` — the GITHUB_TOKEN caveat only applies to tags pushed by a
# workflow.)
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. One-time setup on
# npmjs.com: package Settings → Trusted publisher → GitHub Actions, with repo
# rebasedotdev/mcp.rebase.dev, workflow filename release.yml and environment npm, so
# only this job in that environment can stage a version; leave "Allow npm publish"
# unticked, so a direct publish is refused. A tag ruleset limits who may create
# v* tags, and the job refuses a tag whose commit is not on main. Staged publishing
# needs npm >= 11.15.0, hence Node 24 + the npm upgrade step below
# (publish-time only — consumers still get engines >= 20).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test & publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag whose commit is not on main
        # fetch-depth 0 brought every branch, origin/main included.
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # The runner's bundled npm can lag the 11.15.0 floor staged publishing needs.
      - run: npm install -g npm@^11.15.0

      - run: npm ci
      - run: npm test

      # Guard: the git tag must match package.json's version, so a stray tag can't
      # publish the wrong version.
      - name: Verify tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}."
            exit 1
          fi

      - name: Stage on npm (a maintainer approves it on npmjs.com)
        run: npm stage publish --provenance --access public
