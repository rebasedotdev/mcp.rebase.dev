name: Release
run-name: 📦 Publish ${{ github.ref_name }} to npm

# Tag-triggered publish — the lowest-ceremony release flow for a single package.
# To cut a release:
#   npm version patch   # bumps package.json, commits, creates the v* tag
#   git push --follow-tags
# (When package.json already carries the version to release — e.g. the first
# release — skip `npm version` and tag by hand: `git tag -a vX.Y.Z -m X.Y.Z`.)
# The pushed tag triggers this workflow, which re-runs the tests and publishes to
# npm with provenance. (Tag pushed from a developer's own credentials DOES trigger
# `on: push: tags` — the GITHUB_TOKEN caveat only applies to tags pushed by a
# workflow.)
#
# Auth is npm trusted publishing (OIDC) — no NPM_TOKEN secret. One-time setup on
# npmjs.com: package Settings → Trusted publisher → GitHub Actions, with repo
# rebasedotdev/mcp.rebase.dev and workflow filename release.yml. Trusted
# publishing needs npm >= 11.5.1, hence Node 24 + the npm upgrade step below
# (publish-time only — consumers still get engines >= 20).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test & publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # The runner's bundled npm can lag the 11.5.1 floor trusted publishing needs.
      - run: npm install -g npm@^11

      - run: npm ci
      - run: npm test

      # Guard: the git tag must match package.json's version, so a stray tag can't
      # publish the wrong version.
      - name: Verify tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
